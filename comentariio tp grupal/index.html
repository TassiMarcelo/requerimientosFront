<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla de Comentarios</title>
</head>
<body>
  <table id="comentariosTable">
    <tr>
      <th>Emisor</th>
      <th>Título</th>
      <th>Fecha y Hora</th>
      <th>Detalle</th>
      <th>Acciones</th>
    </tr>
  </table>

  <script type="module">
    import { comentarios } from './data.js';
    
    const tablaComentarios = document.getElementById('comentariosTable');

    comentarios.forEach(comentario => {
      const fila = document.createElement('tr');
      fila.innerHTML = `
        <td>${comentario.emisor}</td>
        <td>${comentario.titulo}</td>
        <td>${comentario.fechaHora}</td>
        <td title="${comentario.detalle}">
          ${comentario.detalle.length > 50 ? comentario.detalle.substring(0, 50) + '...' : comentario.detalle}
        </td>
        <td><button class="btn btn-primary btn-sm" onclick="alert('Detalle: ${comentario.detalle}')">Ver Detalle</button></td>
      `;
      tablaComentarios.appendChild(fila);
    });
  </script>
</body>
</html>
