<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla de Comentarios</title>
  <!-- Bootstrap CSS -->
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .modal-body {
      max-height: 400px; /* Ajusta la altura máxima */
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h2 class="mb-4">Lista de Comentarios</h2>
    <table class="table table-hover table-bordered">
      <thead class="thead-dark">
        <tr>
          <th>Emisor</th>
          <th>Título</th>
          <th>Fecha y Hora</th>
          <th>Detalle</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="comentariosTable"></tbody>
    </table>
  </div>

  <!-- Modal Bootstrap (con scroll en el cuerpo) -->
  <div class="modal fade" id="detalleModal" tabindex="-1" role="dialog" aria-labelledby="detalleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detalleModalLabel">Detalle del Comentario</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body" id="modalDetalle">
          <!-- Aquí se cargará el detalle del comentario -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (necesario para el modal) -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

  <script>
    const comentarios = [
      {
        id: 1,
        emisor: "Juan Pérez",
        titulo: "Confirmación de Turno",
        fechaHora: "06/02/2025 14:30",
        detalle: "Estimado paciente, su turno ha sido reservado con éxito para el 10/02/2025 a las 10:00 AM. Por favor, no olvide llevar su DNI. Este turno es muy importante, así que por favor confirme su asistencia al menos 24 horas antes. Si tiene alguna pregunta, no dude en contactarnos. Estimado paciente, su turno ha sido reservado con éxito para el 10/02/2025 a las 10:00 AM. Por favor, no olvide llevar su DNI. Este turno es muy importante, así que por favor confirme su asistencia al menos 24 horas antes. Si tiene alguna pregunta, no dude en contactarnos.Estimado paciente, su turno ha sido reservado con éxito para el 10/02/2025 a las 10:00 AM. Por favor, no olvide llevar su DNI. Este turno es muy importante, así que por favor confirme su asistencia al menos 24 horas antes. Si tiene alguna pregunta, no dude en contactarnos.Estimado paciente, su turno ha sido reservado con éxito para el 10/02/2025 a las 10:00 AM. Por favor, no olvide llevar su DNI. Este turno es muy importante, así que por favor confirme su asistencia al menos 24 horas antes. Si tiene alguna pregunta, no dude en contactarnos.Estimado paciente, su turno ha sido reservado con éxito para el 10/02/2025 a las 10:00 AM. Por favor, no olvide llevar su DNI. Este turno es muy importante, así que por favor confirme su asistencia al menos 24 horas antes. Si tiene alguna pregunta, no dude en contactarnos.",
        archivosAdjuntos: ["Comprobante_Turno.pdf", "Instrucciones_PreTurno.pdf"]
      },
      {
        id: 2,
        emisor: "Ana López",
        titulo: "Resultado de Estudio",
        fechaHora: "05/02/2025 10:15",
        detalle: "Su resultado de análisis está disponible. Puede retirarlo en la recepción del hospital durante nuestro horario habitual de lunes a viernes de 8:00 AM a 4:00 PM. No olvide llevar su DNI.",
        archivosAdjuntos: ["Resultado_Analisis.pdf"]
      }
    ];

    const tablaComentarios = document.getElementById('comentariosTable');

    comentarios.forEach(comentario => {
      const fila = document.createElement('tr');
      fila.innerHTML = `
        <td>${comentario.emisor}</td>
        <td>${comentario.titulo}</td>
        <td>${comentario.fechaHora}</td>
        <td title="${comentario.detalle}">
          ${comentario.detalle.length > 50 ? comentario.detalle.substring(0, 50) + '...' : comentario.detalle}
        </td>
        <td>
          <button class="btn btn-primary btn-sm" onclick="mostrarDetalle(${comentario.id})">Ver Detalle</button>
        </td>
      `;
      tablaComentarios.appendChild(fila);
    });

    function mostrarDetalle(id) {
      const comentario = comentarios.find(c => c.id === id);
      const modalDetalle = document.getElementById('modalDetalle');
      let archivosHTML = comentario.archivosAdjuntos.map(archivo => `
        <p>
          <a href="descargas/${archivo}" download class="btn btn-success btn-sm">
            Descargar ${archivo}
          </a>
        </p>
      `).join('');
      modalDetalle.innerHTML = `
        <p><strong>Emisor:</strong> ${comentario.emisor}</p>
        <p><strong>Título:</strong> ${comentario.titulo}</p>
        <p><strong>Fecha y Hora:</strong> ${comentario.fechaHora}</p>
        <p><strong>Detalle:</strong> ${comentario.detalle}</p>
        <p><strong>Archivos Adjuntos:</strong></p>
        ${archivosHTML}
      `;
      $('#detalleModal').modal('show');
    }
  </script>
</body>
</html>
